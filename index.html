<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tchê Parrilla</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#120F0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tchê Parrilla">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app de celular escuro (brasa noturna), 5 abas fixas embaixo; a foto real da churrasqueira é o mapa; números em mono como etiqueta de açougue */
:root{
  --carvao:#120F0D; --tiz:#1C1714; --tiz2:#261F1A; --linha:#3A302A;
  --osso:#F2E8DD; --fumaca:#A89A8E; --brasa:#FF7A2F; --brasa2:#E2541B; --cobre:#C98B5B; --couro:#7A4E33;
  --ok:#8BC48A; --alerta:#F2B544; --perigo:#FF6B5A;
  --f-marca:'Alfa Slab One','Rockwell','Roboto Slab',Georgia,serif;
  --f-corpo:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-dado:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--carvao);color:var(--osso);margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{font-family:var(--f-corpo);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--carvao)}
.app{max-width:640px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brasa);outline-offset:2px}
.mono{font-family:var(--f-dado);font-variant-numeric:tabular-nums}

/* cabeçalho */
.top{display:flex;align-items:center;gap:12px;padding-block:calc(24px + env(safe-area-inset-top,0px)) 14px;position:relative}
.emblema{width:46px;height:46px;flex:none;color:var(--cobre)}
.marca{font-family:var(--f-marca);font-weight:400;font-size:22px;letter-spacing:.06em;line-height:1.2;margin:0;padding-top:2px}
.marca b{color:var(--brasa);font-weight:400}
.sub{font-size:12px;color:var(--fumaca);letter-spacing:.08em;text-transform:uppercase;margin-top:5px}
.top .data{margin-left:auto}
.top input[type=date]{background:var(--tiz);border:1px solid var(--linha);border-radius:10px;padding:7px 9px;font-family:var(--f-dado);font-size:13px;max-width:150px}

h2.sec{font-family:var(--f-marca);font-weight:400;font-size:19px;letter-spacing:.03em;margin:26px 0 10px;text-wrap:balance}
h3.cat{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cobre);margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
h3.cat span{color:var(--fumaca);letter-spacing:.04em;font-family:var(--f-dado);font-weight:400}
.muted{color:var(--fumaca)}
.small{font-size:13px}

/* quem vem */
.gente{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.passo{background:var(--tiz);border:1px solid var(--linha);border-radius:14px;padding:10px 8px;text-align:center}
.passo .rot{font-size:12px;color:var(--fumaca)}
.passo .rot small{display:block;font-family:var(--f-dado);font-size:10.5px;opacity:.8}
.passo .ctl{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.passo .ctl button{width:34px;height:34px;border-radius:50%;border:1px solid var(--linha);background:var(--tiz2);font-size:19px;line-height:1}
.passo .ctl output{font-family:var(--f-dado);font-size:22px;font-weight:500}
.linha2{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.campo{flex:1 1 140px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--tiz);border:1px solid var(--linha);border-radius:12px;padding:8px 12px}
.campo label{font-size:13px;color:var(--fumaca)}
.campo input[type=time]{background:transparent;border:0;font-family:var(--f-dado);font-size:16px}
.sw{position:relative;width:42px;height:24px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:12px;background:var(--linha);transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--osso);transition:transform .2s}
.sw input:checked+i{background:var(--brasa2)}
.sw input:checked+i::after{transform:translateX(18px)}

/* presets */
.presets{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-2px}
.presets::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--linha);background:var(--tiz);border-radius:999px;padding:7px 13px;font-size:13px;white-space:nowrap}
.chip.on{border-color:var(--brasa);color:var(--brasa)}

/* leitura do assador */
.leitura{margin-top:18px;border:1px solid var(--couro);border-radius:16px;background:linear-gradient(160deg,var(--tiz2),var(--tiz));overflow:hidden}
.leitura .nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--linha)}
.leitura .num{padding:12px 8px;text-align:center;border-right:1px solid var(--linha)}
.leitura .num:last-child{border-right:0}
.leitura .num b{display:block;font-family:var(--f-dado);font-weight:500;font-size:18px;color:var(--osso)}
.leitura .num span{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--fumaca)}
.leitura ul{list-style:none;margin:0;padding:10px 14px 12px;display:grid;gap:7px}
.leitura li{font-size:13.5px;padding-left:16px;position:relative}
.leitura li::before{content:"";position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:2px;background:var(--cobre)}
.leitura li.alerta::before{background:var(--alerta)}
.leitura li.perigo::before{background:var(--perigo)}
.leitura li.ok::before{background:var(--ok)}

/* cardápio */
.itens{display:grid;gap:6px}
.item{background:var(--tiz);border:1px solid var(--linha);border-radius:12px;transition:border-color .15s,background .15s}
.item.on{border-color:var(--brasa2);background:linear-gradient(90deg,rgba(226,84,27,.14),var(--tiz) 60%)}
.item .row{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px}
.item .tog{flex:1;min-width:0;display:flex;align-items:center;gap:11px;background:none;border:0;padding:0;text-align:left}
.box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--fumaca);flex:none;display:grid;place-items:center}
.item.on .box{background:var(--brasa);border-color:var(--brasa)}
.item.on .box::after{content:"";width:9px;height:5px;border:2px solid var(--carvao);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.nome{font-weight:600;font-size:14.5px}
.meta{font-size:12px;color:var(--fumaca);font-family:var(--f-dado);margin-top:1px}
.assin{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--brasa);border:1px solid var(--brasa2);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px;font-family:var(--f-corpo)}
.dicab{flex:none;background:none;border:1px solid var(--linha);border-radius:8px;font-size:12px;padding:5px 9px;color:var(--fumaca)}
.dicab[aria-expanded=true]{color:var(--brasa);border-color:var(--brasa2)}
.dica{padding:0 14px 13px 43px;font-size:13.5px;color:var(--osso)}
.dica p{margin:0 0 6px;max-width:62ch}
.dica .ped{color:var(--cobre);font-size:12.5px}

/* compras */
.totais{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.tot{flex:1 1 130px;background:var(--tiz);border:1px solid var(--linha);border-radius:14px;padding:12px 14px}
.tot b{display:block;font-family:var(--f-dado);font-size:24px;font-weight:500}
.tot.dest b{color:var(--brasa)}
.tot span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fumaca)}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--linha);background:var(--tiz2);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.pri{background:var(--brasa2);border-color:var(--brasa2);color:#fff}
.btn.peq{padding:6px 10px;font-size:12.5px;border-radius:9px}
.secao{margin-top:18px}
.lc{display:flex;align-items:flex-start;gap:11px;padding:11px 2px;border-bottom:1px dashed var(--linha)}
.lc:last-child{border-bottom:0}
.lc .box{margin-top:2px;background:none;padding:0}
.lc.feito .box{background:var(--ok);border-color:var(--ok)}
.lc.feito .box::after{content:"";width:9px;height:5px;border:2px solid var(--carvao);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.lc.feito .lcn{text-decoration:line-through;color:var(--fumaca)}
.lc .lcb{flex:1;min-width:0}
.lcn{font-weight:600;font-size:14.5px}
.lcq{font-family:var(--f-dado);font-size:13px;color:var(--brasa)}
.lcp{font-size:12.5px;color:var(--fumaca);margin-top:2px}
.preco{flex:none;text-align:right;font-family:var(--f-dado);font-size:13px}
.preco button{background:none;border:0;border-bottom:1px dotted var(--fumaca);padding:0;font-size:11.5px;color:var(--fumaca);font-family:var(--f-dado)}
.preco input{width:76px;background:var(--tiz2);border:1px solid var(--brasa2);border-radius:6px;padding:3px 5px;font-family:var(--f-dado);font-size:12.5px;text-align:right}
.nota{font-size:12.5px;color:var(--fumaca);margin-top:12px;max-width:62ch}

/* fogo */
.mapa{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--linha);background:var(--tiz)}
.mapa img{display:block;width:100%;height:auto;filter:saturate(.8) brightness(.78)}
.pin{position:absolute;transform:translate(-50%,-50%);min-width:30px;height:30px;border-radius:15px;padding:0 8px;border:2px solid var(--osso);
  background:rgba(18,15,13,.82);font-family:var(--f-dado);font-size:13px;font-weight:500;display:grid;place-items:center}
.pin.ativo{background:var(--brasa2);border-color:#FFD2B8;box-shadow:0 0 0 0 rgba(255,122,47,.6);animation:brasa 2.4s ease-out infinite}
.pin.sel{outline:3px solid var(--osso);outline-offset:2px}
@keyframes brasa{0%{box-shadow:0 0 0 0 rgba(255,122,47,.55)}70%{box-shadow:0 0 0 12px rgba(255,122,47,0)}100%{box-shadow:0 0 0 0 rgba(255,122,47,0)}}
@media (prefers-reduced-motion:reduce){.pin.ativo{animation:none}}
.pinfo{margin-top:10px;background:var(--tiz);border:1px solid var(--linha);border-radius:14px;padding:12px 14px}
.pinfo h4{margin:0 0 4px;font-size:15px}
.pinfo ul{margin:8px 0 0;padding-left:18px;font-size:13.5px}
.legenda{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.legenda button{font-size:12px;border:1px solid var(--linha);background:var(--tiz);border-radius:999px;padding:5px 10px}
.legenda button.sel{border-color:var(--brasa);color:var(--brasa)}
.modo{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--tiz2);border:1px solid var(--couro);border-radius:14px;padding:12px 14px;margin-top:6px}
.modo p{margin:0;font-size:12.5px;color:var(--fumaca)}
.crono{list-style:none;margin:10px 0 0;padding:0;position:relative}
.crono::before{content:"";position:absolute;left:58px;top:6px;bottom:6px;width:2px;background:var(--linha)}
.ev{display:grid;grid-template-columns:50px 18px minmax(0,1fr);gap:0 8px;padding:7px 0;align-items:start}
.ev time{font-family:var(--f-dado);font-size:13.5px;text-align:right;padding-top:1px}
.ev .dot{width:12px;height:12px;border-radius:50%;margin:4px 0 0 1px;border:2px solid var(--carvao);background:var(--fumaca);position:relative;z-index:1}
.ev.fogo .dot{background:var(--brasa)}
.ev.entra .dot{background:var(--cobre)}
.ev.sai .dot{background:var(--ok)}
.ev.prep .dot{background:var(--fumaca)}
.ev.serve .dot{background:var(--osso);width:14px;height:14px;margin-left:0}
.ev .tx{font-size:14px}
.ev .tx small{display:block;color:var(--fumaca);font-size:12px}
.ev.serve .tx{font-family:var(--f-marca);font-weight:400;font-size:16px;letter-spacing:.03em}
.ev.passou{opacity:.42}
.ev.agora time{color:var(--brasa)}
.agora-linha{display:flex;align-items:center;gap:8px;font-family:var(--f-dado);font-size:11px;color:var(--brasa);margin:2px 0 2px 34px}
.agora-linha::after{content:"";flex:1;height:1px;background:var(--brasa)}

/* arsenal */
.ars{display:grid;gap:8px}
.arm{background:var(--tiz);border:1px solid var(--linha);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.arm.hoje{border-color:var(--couro)}
.arm .t{flex:1;min-width:0}
.arm .t b{font-size:14.5px}
.arm .t p{margin:3px 0 0;font-size:13px;color:var(--fumaca);max-width:62ch}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--brasa);margin-left:6px}
.seg{flex:none;display:flex;border:1px solid var(--linha);border-radius:9px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 9px;font-size:12px;color:var(--fumaca)}
.seg button.on{background:var(--tiz2);color:var(--osso)}
.seg button.on.tenho{color:var(--ok)}
.seg button.on.quero{color:var(--alerta)}

/* histórico */
.salvar{background:var(--tiz);border:1px solid var(--couro);border-radius:16px;padding:14px;display:grid;gap:10px}
.salvar input[type=text],.salvar textarea{width:100%;box-sizing:border-box;background:var(--tiz2);border:1px solid var(--linha);border-radius:10px;padding:9px 11px;font-size:14px}
.salvar textarea{min-height:64px;resize:vertical}
.estrelas{display:flex;gap:4px}
.estrelas button{background:none;border:0;font-size:24px;line-height:1;padding:2px;color:var(--linha)}
.estrelas button.on{color:var(--brasa)}
.hist{display:grid;gap:8px;margin-top:6px}
.hc{background:var(--tiz);border:1px solid var(--linha);border-radius:14px;padding:12px 14px}
.hc .hh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.hc .hh b{font-size:15px}
.hc .hm{font-family:var(--f-dado);font-size:12px;color:var(--fumaca);margin-top:2px}
.hc .hi{font-size:13px;margin-top:6px;color:var(--osso)}
.hc .ho{font-size:13px;margin-top:6px;color:var(--cobre);font-style:italic}
.fav{background:none;border:0;font-size:20px;line-height:1;color:var(--linha);padding:0}
.fav.on{color:var(--alerta)}
.vazio{border:1px dashed var(--linha);border-radius:14px;padding:18px;text-align:center;color:var(--fumaca);font-size:13.5px}
.filtro{display:flex;gap:6px;margin-top:4px}

/* convidados */
.passo .ctl button:disabled{opacity:.35;cursor:default}
.conv{margin-top:8px;background:var(--tiz);border:1px solid var(--linha);border-radius:14px}
.conv-tit{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;padding:11px 14px;text-align:left;font-size:14px}
.conv-tit > span:last-child{font-family:var(--f-dado);font-size:18px;color:var(--fumaca)}
.conv-corpo{display:grid;gap:8px;padding:0 12px 12px}
.conv-add{display:flex;gap:6px}
.conv-add input{flex:1;min-width:0}
.conv input[type=text],.conv select,.rateio input,.fbs select{background:var(--tiz2);border:1px solid var(--linha);border-radius:9px;padding:7px 9px;font-size:14px;min-width:0}
.rateio .campo input{background:transparent;border:0;text-align:right;width:100%;font-family:var(--f-dado);font-size:15px;padding:2px 0}
.rateio .campo{flex:1 1 180px}
.turma{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.turma .chip{padding:5px 11px;font-size:12.5px}
.cv{display:grid;gap:6px;padding:9px 0;border-top:1px dashed var(--linha)}
.cv-l1{display:flex;align-items:center;gap:8px}
.cv-l1 b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv-l1 select{font-size:13px;padding:5px 7px}
.paga{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--fumaca)}
.paga input{accent-color:var(--brasa2);width:16px;height:16px}
.cv-x{background:none;border:1px solid var(--linha);border-radius:8px;width:30px;height:30px;font-size:17px;line-height:1;color:var(--fumaca)}
.cv-obs{width:100%;box-sizing:border-box;font-size:13px!important}
.rateio{display:grid;gap:8px}

/* chef */
.chef{display:grid;gap:10px;background:linear-gradient(160deg,var(--tiz2),var(--tiz));border:1px solid var(--couro);border-radius:16px;padding:14px}
.sugest{display:flex;flex-wrap:wrap;gap:6px}
.sugest .chip{white-space:normal;text-align:left;font-size:12.5px;line-height:1.3}
.conversa{display:grid;gap:8px;max-height:52vh;overflow-y:auto}
.msg{font-size:14px;line-height:1.5;padding:10px 12px;border-radius:12px;max-width:92%}
.msg.eu{justify-self:end;background:var(--brasa2);color:#fff;border-bottom-right-radius:4px}
.msg.chefm{justify-self:start;background:var(--carvao);border:1px solid var(--linha);border-bottom-left-radius:4px}
.chef-in{display:flex;gap:8px;align-items:flex-end}
.chef-in textarea{flex:1;min-width:0;background:var(--carvao);border:1px solid var(--linha);border-radius:12px;padding:9px 11px;font-size:14px;resize:none}

/* histórico: retorno e fotos */
.fb{display:grid;gap:5px}
.fb .seg{flex-wrap:wrap;justify-self:start}
.fbs{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px}
.fbs select{font-size:12.5px;padding:4px 6px;margin-left:4px}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin-top:10px}
.foto{padding:0;border:1px solid var(--linha);border-radius:10px;overflow:hidden;background:var(--tiz2);aspect-ratio:1;max-width:100%}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.lightbox{position:fixed;inset:0;z-index:40;background:rgba(10,8,7,.94);display:grid;place-items:center;gap:12px;align-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lightbox img{max-width:100%;max-height:78vh;border-radius:12px}

/* entrar */
.entrar{min-height:100vh;display:grid;place-items:center;text-align:center;padding-block:40px}
.entrar .cx{display:grid;gap:14px;justify-items:center;width:100%;max-width:340px}
.entrar img{width:112px;height:112px;border-radius:26px}
.entrar h1{font-family:var(--f-marca);font-weight:400;font-size:28px;letter-spacing:.06em;margin:6px 0 0}
.entrar h1 b{color:var(--brasa);font-weight:400}
.entrar p{margin:0;color:var(--fumaca);font-size:14px}
.entrar .btn{width:100%;justify-content:center}
.entrar input{width:100%;background:var(--tiz);border:1px solid var(--linha);border-radius:12px;padding:11px 12px;font-size:16px}
.sair{background:none;border:0;color:var(--fumaca);font-size:12px;text-decoration:underline;padding:0}

/* abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(18,15,13,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--linha);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));

// aprendizado: média dos últimos 6 retornos de "como foi"
const FB={muito:{n:'Sobrou muito',v:-.15},pouco:{n:'Sobrou um pouco',v:-.06},certo:{n:'Na medida',v:0},faltou:{n:'Faltou',v:.12}};
function calibra(campo){
  const xs=HIST.filter(h=>h.fb&&FB[h.fb[campo]]).slice(0,6).map(h=>FB[h.fb[campo]].v);
  if(!xs.length)return {f:0,n:0};
  return {f:Math.max(-.3,Math.min(.3,xs.reduce((s,v)=>s+v,0)/xs.length)),n:xs.length};
}

/* ===================== cálculo ===================== */
const nf=(n,d=0)=>n.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const brl=n=>'R$ '+nf(n,n<10?2:0);
const up=(x,s)=>Math.ceil(x/s-1e-9)*s;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toMin=h=>{const [a,b]=(h||'13:00').split(':').map(Number);return a*60+b};
const hhmm=t=>{t=((Math.round(t)%1440)+1440)%1440;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
const ehEsp=e=>e==='espeto-alto'||e==='espeto-baixo'||e==='cesto';
const preco=(k,base)=>CFG.precos[k]!=null?CFG.precos[k]:base;
function plural(un,q){return (q>1&&un!=='un'&&un!=='kg')?un+'s':un}
function qtd(q,un){if(un==='kg')return q<1?nf(q*1000,0)+' g':nf(q,1)+' kg';return nf(q,Number.isInteger(q)?0:1)+' '+plural(un,q)}

function calc(){
  const p=gente(), pessoas=p.c+p.a+p.k, AE=.6*p.c+p.a+1.3*p.k, calC=calibra('carne'), calB=calibra('bebida');
  const sel=S.sel.map(id=>POR_ID[id]).filter(Boolean);
  const carnes=sel.filter(i=>i.carne), lados=sel.filter(i=>LADO.includes(i.cat));
  const nl=lados.length;
  const nivel=nl<=1?{f:1.15,n:'pouco acompanhamento',d:'+15%'}:nl<=3?{f:1,n:'equilibrado',d:'base'}:{f:.85,n:'mesa farta',d:'−15%'};
  const GR={c:200,a:400,k:600};
  const gBase=S.conv.length?S.conv.filter(x=>!/veget|vegan/i.test(x.obs||'')).reduce((s,x)=>s+GR[x.t],0):GR.c*p.c+GR.a*p.a+GR.k*p.k;
  const gLimpo=gBase*nivel.f*(1+calC.f);
  const W=carnes.reduce((s,i)=>s+PESO[i.papel],0)||1;
  const linhas={}; let custo=0, kgCompra=0;
  const add=(key,nome,q,un,secao,pu,nota,ped)=>{const L=linhas[key]||(linhas[key]={key,nome,q:0,un,secao,pu,nota,ped});L.q+=q};
  const espN={};
  for(const i of carnes){
    const kgL=gLimpo/1000*PESO[i.papel]/W;
    const kg=Math.max(.3,up(kgL*i.rend,.1));
    i._kg=kg; kgCompra+=kg;
    const pecas=i.peca?Math.max(1,Math.round(kg/i.peca)):0;
    add(i.id,i.nome.replace(/ no espeto| na brasa/,''),kg,'kg',i.secao||'Açougue',preco(i.id,i.preco),pecas?`≈ ${pecas} ${pecas>1?'peças':'peça'} de ${nf(i.peca,1)} kg`:'',i.pedido);
    if(ehEsp(i.est))espN[i.id]=Math.max(1,Math.ceil(kg/(i.kgEsp||1.5)));
    (i.ing||[]).forEach(([k,q,por])=>{const g=ING[k];add(k,g[0],q*Math.max(1,Math.ceil(AE/por)),g[1],g[2],preco(k,g[3]))});
  }
  for(const i of sel.filter(i=>!i.carne)){
    if(i.beb){const g=ING[i.k];const n=i.k==='gelo'?i.beb(p):Math.max(1,Math.ceil(i.beb(p)*(1+calB.f)-.2));add(i.k,g[0],n,g[1],g[2],preco(i.k,g[3]));continue}
    (i.ing||[]).forEach(([k,q,por])=>{const g=ING[k];const n=q*Math.max(1,Math.ceil(AE/por));add(k,g[0],g[1]==='kg'?up(n,.1):n,g[1],g[2],preco(k,g[3]))});
    if(ehEsp(i.est))espN[i.id]=i.id==='abacaxi'?Math.max(1,Math.ceil(Math.ceil(AE/8)/(i.porEsp||1))):1;
  }
  const ev=cronograma(sel,espN);
  if(S.carvao&&ev.espSpan>0){const n=Math.max(1,Math.ceil(ev.espSpan/90));add('carvao',ING.carvao[0],n,'saco','Fogo',preco('carvao',ING.carvao[3]))}
  for(const L of Object.values(linhas)){L.total=L.q*L.pu;custo+=L.total}
  return {p,pessoas,AE,sel,carnes,lados,nivel,gLimpo,kgCompra,linhas:Object.values(linhas),custo,espN,ev,calC,calB};
}

function cronograma(sel,espN){
  const serve=toMin(S.hora), ev=[]; let fogo=Infinity, esp=Infinity, espFim=-Infinity, carne=Infinity;
  const ints=[];
  for(const i of sel){
    if(i.cat==='bebida'||i.semEvento)continue;
    if(i.prepAt!=null){ev.push({t:serve+i.prepAt,k:'prep',tx:'Preparar '+i.nome,sub:'Cozinha'});continue}
    const pronto=serve+(PRONTO[i.papel]??0);
    if(i.est==='cozinha'){ev.push({t:pronto-i.dur-10,k:'prep',tx:'Preparar '+i.nome,sub:'Cozinha'});continue}
    const ini=pronto-i.dur-(i.desc||0);
    ev.push({t:ini,k:'entra',tx:i.nome,sub:EST[i.est].n+(espN[i.id]>1?` · ${espN[i.id]} espetos`:''),est:i.est,id:i.id});
    ev.push(i.desc?{t:pronto-i.desc,k:'sai',tx:'Retirar '+i.nome,sub:`Descanso de ${i.desc} min`,id:i.id}:{t:pronto,k:'sai',tx:'Servir '+i.nome,sub:EST[i.est].n,id:i.id});
    (i.prep||[]).forEach(([o,tx])=>ev.push(o==='vespera'?{t:-1e6,vespera:true,k:'prep',tx,sub:'Véspera'}:{t:ini+o,k:'prep',tx,sub:'Preparo'}));
    fogo=Math.min(fogo,ini);
    if(ehEsp(i.est)){esp=Math.min(esp,ini);espFim=Math.max(espFim,pronto);ints.push({a:ini,b:pronto,est:i.est,n:espN[i.id]||1,nome:i.nome})}
    if(i.carne&&i.cat!=='mar')carne=Math.min(carne,ini);
  }
  if(fogo<Infinity){
    ev.push({t:fogo-45,k:'fogo',tx:'Acender o braseiro',sub:'Lenha leva cerca de 40 min para dar brasa'});
    const fim=serve+40;
    for(let t=fogo+45;t<fim-30;t+=50)ev.push({t,k:'fogo',tx:'Repor lenha no braseiro',sub:'Puxe brasa nova para baixo da parrilla'});
  }
  if(esp<Infinity)ev.push({t:esp-20,k:'fogo',tx:S.carvao?'Acender carvão no fosso dos espetos':'Puxar brasa para o fosso dos espetos',sub:'Espetos'});
  if(carne<Infinity)ev.push({t:carne-40,k:'prep',tx:'Tirar as carnes da geladeira',sub:'Peixe só na hora'});
  if(sel.some(i=>i.cat==='bebida'))ev.push({t:serve-180,k:'prep',tx:'Bebidas no gelo',sub:'Bebidas'});
  ev.push({t:serve,k:'serve',tx:'Hora de servir'});
  ev.sort((x,y)=>x.t-y.t||(x.k==='serve')-(y.k==='serve'));
  // pico de espetos por fileira
  const pico={};
  for(const e of ['espeto-alto','espeto-baixo','cesto']){
    const xs=ints.filter(x=>x.est===e);let m=0;
    for(const x of xs){const n=xs.filter(y=>y.a<x.b&&y.b>x.a&&y.a<=x.a).reduce((s,y)=>s+y.n,0);m=Math.max(m,n)}
    pico[e]=m;
  }
  ev.pico=pico; ev.espSpan=esp<Infinity?espFim-esp:0; ev.inicio=fogo<Infinity?fogo-45:serve;
  return ev;
}

function leitura(C){
  const L=[], ids=new Set(S.sel), tem=a=>a.some(x=>ids.has(x));
  if(!C.pessoas)return [{c:'alerta',t:'Informe quantas pessoas vêm.'}];
  if(C.carnes.length){
    L.push({c:'ok',t:`${C.lados.length} ${C.lados.length===1?'acompanhamento':'acompanhamentos'}: ${C.nivel.n}. Carne ajustada em ${C.nivel.d}, ${nf(C.gLimpo/C.AE,0)} g limpos por adulto.`});
  }else L.push({c:'alerta',t:'Nenhuma carne escolhida ainda.'});
  const pct=f=>(f>0?'+':'−')+nf(Math.abs(f*100),0)+'%';
  if(C.calC.n&&C.calC.f)L.push({c:'ok',t:`Aprendido com ${C.calC.n} ${C.calC.n>1?'churrascos':'churrasco'}: carne ${pct(C.calC.f)}.`});
  if(C.calB.n&&C.calB.f)L.push({c:'ok',t:`Aprendido com ${C.calB.n} ${C.calB.n>1?'churrascos':'churrasco'}: bebida ${pct(C.calB.f)}.`});
  const obs=S.conv.filter(x=>x.obs&&x.obs.trim());
  const conta=re=>obs.filter(x=>re.test(x.obs.toLowerCase()));
  const veg=conta(/veget|vegan/), glu=conta(/gl[uú]ten|cel[ií]ac/), lac=conta(/lactose|leite/), mar=conta(/camar|fruto|marisco|peixe/);
  if(veg.length)L.push({c:'alerta',t:`${veg.map(x=>x.n).join(', ')}: sem carne. Garanta legumes, provoleta, morrón con huevo ou batata no rescoldo.`});
  if(glu.length)L.push({c:'alerta',t:`${glu.map(x=>x.n).join(', ')}: sem glúten. Farofa de mandioca serve; pão de alho e choripán não.`});
  if(lac.length)L.push({c:'alerta',t:`${lac.map(x=>x.n).join(', ')}: sem lactose. Provoleta, brie e manteiga de ervas ficam de fora para eles.`});
  if(mar.length&&tem(['camarao','polvo','salmao','tainha']))L.push({c:'perigo',t:`${mar.map(x=>x.n).join(', ')} tem restrição a frutos do mar ou peixe, e há peixe no cardápio. Use pinça e grelha separadas.`});
  const outras=obs.filter(x=>!veg.includes(x)&&!glu.includes(x)&&!lac.includes(x)&&!mar.includes(x));
  if(outras.length)L.push({c:'dica',t:'Observações: '+outras.map(x=>`${x.n}: ${x.obs}`).join('; ')+'.'});
  if(C.lados.length<=1&&C.carnes.length)L.push({c:'dica',t:'Pouca guarnição. Abacaxi na rotativa ou provoleta seguram a fome sem pesar na conta de carne.'});
  if(C.p.c>0&&!tem(['linguica','coracao','asa','coalho','milho','banana','pao_alho']))L.push({c:'dica',t:'Tem criança: linguiça, coxinha da asa, queijo coalho e milho costumam agradar.'});
  if(C.carnes.some(i=>i.est==='parrilla')&&!tem(['chimichurri','criolla','manteiga_ervas']))L.push({c:'dica',t:'Sem molho para os cortes de parrilla: chimichurri acompanha todos.'});
  if(ids.has('costelinha')&&!ids.has('barbecue'))L.push({c:'alerta',t:'Costelinha sem barbecue: inclua o molho para pincelar nos últimos 15 min.'});
  if(C.carnes.length&&!ids.has('sal'))L.push({c:'alerta',t:'Sal parrillero e sal grosso não estão na lista.'});
  if(ids.has('tainha'))L.push({c:'dica',t:'Tainha inteira pede grelha-sanduíche. Veja o Arsenal.'});
  const nomesE={'espeto-alto':'fileira de cima','espeto-baixo':'fileira de baixo',cesto:'cesto'};
  for(const [e,n] of Object.entries(C.ev.pico)){if(n>CAP[e])L.push({c:'perigo',t:`Espetos: ${n} ao mesmo tempo na ${nomesE[e]}, que tem ${CAP[e]}. Escalone os horários ou passe algo para a parrilla.`})}
  if(S.data===hojeISO()){
    const agora=new Date(), m=agora.getHours()*60+agora.getMinutes();
    if(C.ev.inicio<m&&toMin(S.hora)>m)L.push({c:'perigo',t:`O fogo precisaria ter começado às ${hhmm(C.ev.inicio)}. Atrase o horário de servir ou troque o corte mais longo.`});
  }
  const har=[];
  if(tem(['costelao','asado_tira','shortrib','cupim','costela_cordeiro','paleta','carre','matambre']))har.push('Tannat uruguaio para gordura e fogo longo');
  if(tem(['entrana','ojo','chorizo','picanha','vazio','maminha','tomahawk','denver','flatiron']))har.push('Malbec para os cortes de parrilla');
  if(tem(['linguica','costelinha','panceta','morcilla']))har.push('Lager ou IPA para o porco');
  if(tem(['salmao','camarao','polvo','tainha']))har.push('Sauvignon Blanc, Albariño ou rosé para o mar');
  if(tem(['galeto','sobrecoxa','asa','coracao'])&&!har.length)har.push('Chardonnay ou cerveja de trigo para o frango');
  if(har.length&&tem(['cerveja','tinto','branco']))L.push({c:'ok',t:'Harmonização: '+har.join('; ')+'.'});
  else if(har.length)L.push({c:'dica',t:'Bebidas fora da conta. Sugestão: '+har.join('; ')+'.'});
  if(!tem(['abacaxi','banana','doce_queijo']))L.push({c:'dica',t:'Sem doce: o abacaxi na rotativa com doce de leite fecha bem.'});
  return L;
}

const V=document.getElementById('view');
function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  document.getElementById('f-data').value=S.data;
  const C=calc();
  // o que está sendo digitado sobrevive à re-renderização (o modo assador re-renderiza a cada 15 s)
  const guarda=['f-chef','f-conv-nome'].map(id=>{const el=document.getElementById(id);return el?{id,v:el.value,f:document.activeElement===el}:null}).filter(Boolean);
  V.innerHTML=({montar:vMontar,compras:vCompras,fogo:vFogo,arsenal:vArsenal,historico:vHist})[tab](C);
  guarda.forEach(g=>{const el=document.getElementById(g.id);if(el){el.value=g.v;if(g.f)el.focus()}});
}

const SECOES=['Açougue','Peixaria','Hortifruti','Frios e laticínios','Padaria','Mercearia','Bebidas','Fogo'];
const assinatura=()=>S.data+'|'+S.sel.slice().sort().join(',');

  <div class="acoes"><button class="btn pri" data-act="copiar">Copiar lista</button>
   <a class="btn" href="https://wa.me/?text=${encodeURIComponent(textoLista(C))}" target="_blank" rel="noopener">Mandar no WhatsApp</a>

       <div class="preco">${brl(l.total)}<br>${ed?`<input type="number" inputmode="decimal" step="0.5" min="0" id="f-preco" value="${l.pu}" aria-label="Preço por ${l.un}">`:`<button data-act="preco" data-k="${l.key}">${brl(l.pu)}/${l.un}</button>`}</div></div>`;
    }
    h+='</div>';
  }
  const R=rateio(C);
  h+=`<h2 class="sec">Rateio</h2><div class="rateio">

   <div class="linha2"><div class="campo"><label for="f-gasto">Gasto real, R$</label><input type="number" inputmode="decimal" min="0" step="1" id="f-gasto" value="${S.gasto??''}" placeholder="${nf(C.custo,0)}"></div>

   <div class="acoes"><button class="btn pri" data-act="cobrar">Copiar cobrança</button><a class="btn" href="https://wa.me/?text=${encodeURIComponent(R.texto)}" target="_blank" rel="noopener">Cobrar no WhatsApp</a></div></div>`;
  return h+`<p class="nota">Preços são estimativas de referência. Toque no preço unitário para corrigir com o valor do seu mercado; o app guarda. Lenha não entra: você usa a de casa.</p>`;
}
function rateio(C){
  const total=S.gasto>0?S.gasto:C.custo;
  const pagantes=S.conv.length?S.conv.filter(x=>x.paga):null;
  const pag=pagantes?pagantes.length:C.p.a+C.p.k;
  const cada=pag?Math.ceil(total/pag*100)/100:0;
  let t=`*Churrasco ${S.data.split('-').reverse().slice(0,2).join('/')}* 🔥\nTotal ${brl(total)} ÷ ${pag} = *R$ ${nf(cada,2)} por pessoa*`;
  if(pagantes&&pagantes.length)t+='\n'+pagantes.map(x=>'• '+x.n).join('\n');
  if(CFG.pix)t+=`\n\nPix: ${CFG.pix}`;
  return {total,pag,cada,texto:t};
}
function textoLista(C){
  let t=`*Tchê Parrilla · ${S.data.split('-').reverse().join('/')}* (${C.pessoas} pessoas)\n`;
  for(const s of SECOES){const ls=C.linhas.filter(l=>l.secao===s);if(!ls.length)continue;t+=`\n*${s}*\n`;ls.forEach(l=>t+=`☐ ${l.nome}: ${qtd(l.q,l.un)}${l.nota?' ('+l.nota+')':''}\n`)}
  return t+`\nEstimativa: ${brl(C.custo)}`;
}

   <button class="btn ${modo?'':'pri'} peq" data-act="modo">${modo?'Desligar':'Ligar'}</button></div><ol class="crono">`;

  }

let modo=false, wake=null, actx=null, timer=null; const avisados=new Set();
function bipe(){if(!actx)return;try{const t=actx.currentTime;[0,.32].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.4,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.25);o.start(t+d);o.stop(t+d+.26)})}catch(e){}}
function tick(){
  if(S.data!==hojeISO())return;
  const n=new Date(), m=n.getHours()*60+n.getMinutes();
  for(const e of calc().ev){if(e.vespera)continue;const key=e.t+e.tx;if(e.t<=m&&e.t>m-2&&!avisados.has(key)){avisados.add(key);bipe();toast(hhmm(e.t)+' · '+e.tx)}}
  if(tab==='fogo')render();
}
async function alternarModo(){
  modo=!modo;
  if(modo){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}
    try{wake=await navigator.wakeLock?.request('screen')}catch(e){wake=null}
    bipe();tick();timer=setInterval(tick,15000);toast(S.data===hojeISO()?'Modo assador ligado':'Modo assador ligado; os bipes valem só no dia do churrasco')}
  else{clearInterval(timer);try{wake&&wake.release()}catch(e){}wake=null}
  render();
}

  enviandoFoto=null;render();
}
V.addEventListener('focusout',e=>{if(e.target.id==='f-preco')e.target.dispatchEvent(new Event('change',{bubbles:true}))});
V.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==='mais'||a==='menos'){S[b.dataset.k]=Math.max(0,Math.min(60,S[b.dataset.k]+(a==='mais'?1:-1)))}
  else if(a==='tog'){S.sel=S.sel.includes(id)?S.sel.filter(x=>x!==id):[...S.sel,id];S.preset=null}
  else if(a==='dica'){abertos.has(id)?abertos.delete(id):abertos.add(id)}
  else if(a==='preset'){const p=PRESETS.find(x=>x.id===id);S.sel=p.sel.slice();S.preset=id;toast(p.n+' carregado')}
  else if(a==='limpar'){S.sel=[];S.preset=null}
  else if(a==='tick'){const s=assinatura();ticks[s]=ticks[s]||{};ticks[s][b.dataset.k]=!ticks[s][b.dataset.k];const ks=Object.keys(ticks);if(ks.length>20)delete ticks[ks[0]];LS.set('tp-ticks',ticks)}
  else if(a==='desmarcar'){delete ticks[assinatura()];LS.set('tp-ticks',ticks)}
  else if(a==='preco'){editPreco=b.dataset.k;render();const i=document.getElementById('f-preco');if(i){i.focus();i.select()}return}
  else if(a==='copiar'){const txt=textoLista(calc());try{await navigator.clipboard.writeText(txt);toast('Lista copiada')}catch(err){toast('Não deu para copiar aqui. Use o botão do WhatsApp.')}return}
  else if(a==='pin'){pinSel=pinSel===id?null:id}
  else if(a==='modo'){alternarModo();return}
  else if(a==='ars'){CFG.arsenal[id]=CFG.arsenal[id]===b.dataset.v?'':b.dataset.v;salvarCfg()}
  else if(a==='sair'){await sb.auth.signOut();return}
  else if(a==='lista'){S.listaAberta=!S.listaAberta}
  else if(a==='conv-add'){addConv();return}
  else if(a==='conv-turma'){addConv(b.dataset.n);return}
  else if(a==='conv-del'){S.conv.splice(+b.dataset.ix,1)}
  else if(a==='conv-limpar'){const g=gente();Object.assign(S,g);S.conv=[]}
  else if(a==='cobrar'){const t=rateio(calc()).texto;try{await navigator.clipboard.writeText(t);toast('Cobrança copiada')}catch(err){toast('Não deu para copiar aqui. Use o botão do WhatsApp.')}return}
  else if(a==='chef-sug'){perguntarChef(b.dataset.q);return}
  else if(a==='chef-ir'){const el=document.getElementById('f-chef');const q=el?el.value:'';if(el)el.value='';perguntarChef(q);return}
  else if(a==='chef-parar'){chefCtl&&chefCtl.abort();return}
  else if(a==='chef-nova'){chat=[];chefErro=''}
  else if(a==='fb-novo'){novo[b.dataset.k]=novo[b.dataset.k]===b.dataset.v?'':b.dataset.v}
  else if(a==='foto'){fotoAberta=b.dataset.f}
  else if(a==='foto-fechar'){fotoAberta=null}
  else if(a==='nota'){novo.nota=+b.dataset.n}
  else if(a==='salvar'){const C=calc();const pre=PRESETS.find(p=>p.id===S.preset);
    const x={titulo:(novo.titulo||(pre?pre.n:'Churrasco')+' · '+S.data.split('-').reverse().slice(0,2).join('/')).slice(0,80),data:S.data,hora:S.hora,pessoas:gente(),conv:S.conv.map(c=>({...c})),sel:S.sel.slice(),carvao:S.carvao,nota:novo.nota,obs:novo.obs.slice(0,600),fav:false,custo:Math.round(S.gasto>0?S.gasto:C.custo),
      fb:{carne:novo.fbCarne,bebida:novo.fbBeb},fotos:[],criadoEm:new Date().toISOString()};
    if(await addHist(x)){novo=NOVO0();toast('Guardado no histórico')}}
  else if(a==='filtro'){histFiltro=b.dataset.v}
  else if(a==='fav'){const x=HIST.find(h=>h.id===id);if(x){updHist(id,{fav:!x.fav});if(db)return}}
  else if(a==='repetir'){const x=HIST.find(h=>h.id===id);if(x){S.sel=(x.sel||[]).filter(i=>POR_ID[i]);Object.assign(S,x.pessoas||{});S.conv=(x.conv||[]).map(c=>({...c}));S.gasto=null;S.hora=x.hora||S.hora;S.carvao=!!x.carvao;S.preset=null;S.data=hojeISO();tab='montar';toast('Cardápio carregado: '+x.titulo);window.scrollTo({top:0})}}
  else if(a==='apagar'){apagar=id}
  else if(a==='apagar-nao'){apagar=null}
  else if(a==='apagar-ok'){apagar=null;await delHist(id);toast('Apagado')}
  salvarRascunho();render();
});
</script>
</body>
